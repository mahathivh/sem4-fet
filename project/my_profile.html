<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Profile Page</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #141e30, #243b55);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
        }

        .container{
            width:800px;
            height:450px;
            background:white;
            border-radius:20px;
            overflow:hidden;
            display:flex;
            box-shadow:0 10px 30px rgba(0,0,0,0.4);
        }

        .left{
            width:40%;
            background:linear-gradient(135deg,#ff6a00,#ee0979);
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .left img{
            width:140px;
            height:140px;
            border-radius:50%;
            border:5px solid white;
            margin-bottom:20px;
        }

        .left h2{
            font-size:28px;
            margin-bottom:10px;
        }

        .left p{
            font-size:18px;
        }

        .right{
            width:60%;
            padding:40px;
            color:#333;
        }

        .right h1{
            color:#ee0979;
            margin-bottom:20px;
        }

        .info{
            margin-bottom:20px;
            line-height:1.8;
            font-size:17px;
        }

        .skills{
            margin-top:20px;
        }

        .skill{
            margin-bottom:15px;
        }

        .bar{
            width:100%;
            height:10px;
            background:#ddd;
            border-radius:10px;
            overflow:hidden;
        }

        .fill{
            height:100%;
            background:linear-gradient(to right,#ff6a00,#ee0979);
        }

        button{
            margin-top:25px;
            padding:12px 25px;
            border:none;
            border-radius:30px;
            background:linear-gradient(to right,#ff6a00,#ee0979);
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            transform:scale(1.05);
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- LEFT SIDE -->
        <div class="left">

            <img src="https://via.placeholder.com/140" alt="Profile">

            <h2>MAHATHI V H</h2>

            <p>Web Development Student</p>

        </div>

        <!-- RIGHT SIDE -->
        <div class="right">

            <h1>About Me</h1>

            <div class="info">
                Hello! I am Mahathi.  
                I love learning HTML, CSS, and JavaScript.
                My dream is to become a creative web designer
                and build modern websites.
            </div>

            <h2>My Skills</h2>

            <div class="skills">

                <div class="skill">
                    <p>HTML</p>
                    <div class="bar">
                        <div class="fill" style="width:90%"></div>
                    </div>
                </div>

                <div class="skill">
                    <p>CSS</p>
                    <div class="bar">
                        <div class="fill" style="width:80%"></div>
                    </div>
                </div>

                <div class="skill">
                    <p>JavaScript</p>
                    <div class="bar">
                        <div class="fill" style="width:65%"></div>
                    </div>
                </div>

            </div>

            <button onclick="showMessage()">
                Say Hello 👋
            </button>

        </div>

    </div>

    <script>
        function showMessage(){
            alert("🌸 Welcome to Mahathi's Creative Portfolio!");
        }
    </script>

</body>
</html>
