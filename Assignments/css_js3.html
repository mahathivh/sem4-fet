<!DOCTYPE html>
<html>
<head>
    <title>Hire Me Contact Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .container {
            width: 320px;
            margin: 40px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
        }

        label {
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            margin-top: 5px;
            margin-bottom: 12px;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #aaa;
        }

        .inline {
            width: auto;
            margin-right: 5px;
        }

        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            border: none;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }

        .output {
            margin-top: 15px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            display: none;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 10px;
        }
    </style>

</head>
<body>

<div class="container">

    <h1>Hire Me</h1>

    <form id="contactForm">

    
        <label>Full Name:</label>
        <input type="text" id="name" required>

        
        <label>Email:</label>
        <input type="email" id="email" required>


        <label>Gender:</label><br>
        <input type="radio" name="gender" value="Male" class="inline"> Male
        <input type="radio" name="gender" value="Female" class="inline"> Female
        <br><br>

        <label>Skills:</label><br>
        <input type="checkbox" value="HTML" class="inline"> HTML
        <input type="checkbox" value="CSS" class="inline"> CSS
        <input type="checkbox" value="JavaScript" class="inline"> JavaScript
        <br><br>

        
        <label>Subject:</label>
        <select id="subject">
            <option value="">-- Select --</option>
            <option>Job</option>
            <option>Internship</option>
            <option>Project</option>
        </select>


        <label>Message:</label>
        <textarea id="message" rows="4"></textarea>

        <input type="submit" value="Submit">

    </form>

    <div class="output" id="output"></div>

    <a href="https://mahathivh.github.io/sem4-fet/">Go to Home Page</a>

</div>

<script>
document.getElementById("contactForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;

    
    let gender = "";
    let genders = document.getElementsByName("gender");
    for (let g of genders) {
        if (g.checked) {
            gender = g.value;
        }
    }

    let skills = [];
    let checkboxes = document.querySelectorAll("input[type='checkbox']:checked");
    checkboxes.forEach(cb => skills.push(cb.value));

    let subject = document.getElementById("subject").value;
    let message = document.getElementById("message").value;

    let outputDiv = document.getElementById("output");

    outputDiv.innerHTML =
        "<h3>Entered Details:</h3>" +
        "<p><b>Name:</b> " + name + "</p>" +
        "<p><b>Email:</b> " + email + "</p>" +
        "<p><b>Gender:</b> " + gender + "</p>" +
        "<p><b>Skills:</b> " + skills.join(", ") + "</p>" +
        "<p><b>Subject:</b> " + subject + "</p>" +
        "<p><b>Message:</b> " + message + "</p>";

    outputDiv.style.display = "block";
});
</script>

</body>
</html>
